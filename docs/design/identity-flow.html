 $('state').innerHTML=screens[model.screen].map(s=>`<option value="${s}">${esc(tr('state'+s[0].toUpperCase()+s.slice(1)))}</option>`).join('');$('state').value=model.state;
 $('viewport').className='viewport '+(model.size==='mobile'?'mobile':'');
 $('viewport').innerHTML=(model.screen==='projects'?projects():`<div class="shell"><aside class="story" aria-label="${esc(tr('brand'))}"><span class="brand">${esc(tr('brand'))}</span><div><svg class="bloom" viewBox="0 0 220 200" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M110 190V75M110 142Q40 143 45 90Q110 97 110 142M110 165Q180 159 179 107Q112 118 110 165"/><ellipse cx="110" cy="42" rx="23" ry="35"/><ellipse cx="110" cy="42" rx="23" ry="35" transform="rotate(60 110 72)"/><ellipse cx="110" cy="42" rx="23" ry="35" transform="rotate(-60 110 72)"/></g></svg><h2>${esc(tr('story'))}</h2><p class="muted">${esc(tr('storyText'))}</p></div><span class="caption">${esc(tr('caption'))}</span></aside><section class="content"><div class="topbar"><span class="brand">${esc(tr('brand'))}</span><small>${esc(tr('cabinet'))}</small></div>${auth()}</section></div>`)+`<p class="review-note">${esc(tr('footer'))} ${esc(tr('demo'))} ${model.screen==='projects'?esc(tr('privateDemo')):''} ${model.state==='rate'?'Retry-After: 15 min — пример для ревью, не фиксированный срок.':''}</p>`;
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{const input=$(b.dataset.reveal);input.type=input.type==='password'?'text':'password';b.textContent=tr(input.type==='password'?'show':'hide');b.setAttribute('aria-label',b.textContent);});
 if($('retry'))$('retry').onclick=()=>go('projects');
 if($('resend'))$('resend').onclick=()=>{model.state='normal';render();$('client-error').innerHTML=notice(model.screen==='resetCode'?'resendNeutral':'resendSuccess');$('code').focus();};
 if($('auth-form'))$('auth-form').onsubmit=e=>{
  e.preventDefault();const email=$('email');if(email)model.email=email.value.trim().toLowerCase();
  const password=$('password');if(password&&model.screen!=='login'&&!/^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9 ])[\x20-\x7e]{8,128}(?![\s\S])/.test(password.value)){$('client-error').innerHTML=notice('invalid',true);password.setAttribute('aria-invalid','true');password.focus();return;}
  if(model.screen==='register')go('code');else if(model.screen==='reset')go('resetCode');else if(model.screen==='resetCode')go('resetCode','success');else go('projects');
 };
}
for(const id of ['screen','state','size','theme','locale'])$(id).onchange=e=>{model[id]=e.target.value;if(!screens[model.screen].includes(model.state))model.state='normal';render();};
render();
</script>
</body>
</html>
