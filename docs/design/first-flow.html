<style>
:root{--ink:#233831;--muted:#65716b;--line:#d8dfd9;--paper:#fffef9;--bg:#eef1ed;--green:#315748;--rose:#c69780;--error:#8a392e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:var(--green)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b2734c;outline-offset:3px}h1,h2,h3,p{margin:0 0 16px}h1{font-size:32px;line-height:1.2}h2{font-size:23px}small,.muted{color:var(--muted)}.review{background:#203d32;color:white;padding:12px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}.review a{color:white;text-decoration:none;padding:5px 8px;border:1px solid #668174;border-radius:5px}.review a[aria-current=page]{background:#fff;color:var(--ink)}.review select,.review button{padding:5px 8px;border:1px solid #799084;border-radius:5px;background:#fff;color:var(--ink)}.brand{letter-spacing:3px;font-weight:700}.shell{max-width:1240px;margin:auto;padding:24px 32px 52px}.appbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 0 20px;margin-bottom:28px;gap:16px}.appbar small{letter-spacing:0}.kicker{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--muted)}.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;color:var(--muted);font-size:13px}.steps span{padding:5px 10px;border:1px solid var(--line);border-radius:20px}.steps .current{background:var(--green);color:white}.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:24px}.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.catalog .panel{padding:18px}.catalog h2{font-size:21px;margin-top:18px}.placeholder{height:220px;background:repeating-linear-gradient(135deg,#f3f3ed,#f3f3ed 12px,#e6e9e2 12px,#e6e9e2 13px);display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);text-align:center;padding:20px}.tag{display:inline-block;border:1px solid var(--line);border-radius:20px;font-size:12px;padding:4px 9px;margin-bottom:12px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}.btn{display:inline-block;padding:11px 18px;border:1px solid var(--green);border-radius:7px;background:var(--green);color:white;text-decoration:none}.secondary{background:transparent;color:var(--green)}.danger{border-color:var(--error);color:var(--error);background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:13px;font-weight:600;margin-bottom:14px}input,select{display:block;background:white;color:var(--ink);width:100%;min-width:0;padding:10px 12px;border:1px solid #aebbb2;border-radius:6px;margin-top:6px}input[type=checkbox],input[type=radio]{width:18px;height:18px;display:inline-block;vertical-align:middle;margin:0 7px 0 0}.inline{display:flex;align-items:center;gap:6px}.notice{background:#f2eee2;border-left:3px solid #a98950;padding:13px 16px;margin:16px 0;font-size:14px}.notice.error{background:#faeae6;border-color:var(--error);color:var(--error)}.notice.ok{background:#e9f0e8;border-color:#52745a}.upload{padding:18px;border:1px dashed #a4b4a7;border-radius:8px;margin-bottom:16px}.formsection{border-top:1px solid var(--line);margin-top:22px;padding-top:20px}.formsection h2{font-size:19px}.sticky{position:sticky;top:16px;align-self:start}.wirephoto{display:grid;place-items:center;min-height:125px;background:#e2e7db;border-radius:90px 90px 8px 8px;color:#526451;font-size:12px;letter-spacing:2px}.invite{position:relative;overflow:hidden;background:#f6f0e4;color:#344833;text-align:center;padding:48px 30px;border:1px solid #c5c7b7;max-width:650px;margin:auto;font-family:Georgia,serif}.invite:before,.invite:after{content:"";position:absolute;width:210px;height:330px;border:1px solid #8f9e80;border-radius:50%;opacity:.45;pointer-events:none}.invite:before{top:-155px;left:-120px;transform:rotate(-25deg)}.invite:after{bottom:-160px;right:-120px;transform:rotate(-25deg)}.invite.sand{background:#f1e6d8;color:#664b35}.invite .eyebrow{font:11px system-ui;letter-spacing:4px;text-transform:uppercase}.invite h1{font-weight:400;font-size:56px;line-height:1.03;margin:24px 0}.invite h1 em{display:block;font-size:26px;font-style:italic;color:#8b7758;margin:10px}.invite .date{letter-spacing:5px;font-size:17px;border-top:1px solid #bfc3b1;border-bottom:1px solid #bfc3b1;padding:16px 0;margin:26px auto;width:80%}.invite h2{font-weight:400;font-size:29px;margin-top:30px}.invite .lede{font-size:18px;max-width:350px;margin:18px auto}.invite .venue{margin-top:28px}.invite .wirephoto{margin:22px auto 0;max-width:340px}.invitation-form{font-family:system-ui;text-align:left;margin-top:28px;padding:22px;background:#fffcf5;border:1px solid #d0cfbf}.invitation-form h2{margin:0 0 12px;font-family:Georgia}.center{max-width:740px;margin:auto}.checklist{padding-left:22px}.checklist li{margin-bottom:10px}.linkbox{padding:14px;background:#eff3ee;border:1px solid var(--line);overflow-wrap:anywhere}.narrow{max-width:390px!important;margin-left:auto;margin-right:auto}.narrow .grid,.narrow .row,.narrow .catalog{grid-template-columns:1fr}.narrow .sticky{position:static}.narrow .sidepreview{display:none}.narrow h1{font-size:28px}.narrow .invite h1{font-size:45px}.narrow .shell{padding:20px 12px}.narrow .panel{padding:18px}.narrow .invite{padding:36px 20px}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.fine{font-size:12px;margin-top:12px}.radio{font-weight:400}.hidden{display:none!important}#toast{max-width:1180px;margin:12px auto;padding:0 20px;color:var(--error)}.progress{height:5px;background:#d6dfd4;margin-top:15px}.progress span{display:block;width:60%;height:5px;background:var(--green)}.field-error{color:var(--error);font-size:13px}code{overflow-wrap:anywhere}footer{margin-top:30px;font-size:12px;color:var(--muted)}
@media(max-width:700px){.shell{padding:20px 14px}.grid,.catalog,.row{grid-template-columns:1fr}.sidepreview{display:none}.panel{padding:18px}.sticky{position:static}.review{padding:10px 14px;gap:7px}.review strong{width:100%}h1{font-size:28px}.invite{padding:40px 22px}.invite h1{font-size:46px}.actions .btn{flex:1;text-align:center}.appbar{margin-bottom:20px}}

<body>
<nav class="review" aria-label="Просмотр эскизов"><strong>ЭСКИЗ · локально, без сохранения и API</strong><a href="#templates">Шаблон</a><a href="#editor">Редактор</a><a href="#preview">Предпросмотр</a><a href="#confirm">Публикация</a><a href="#published">Ссылка</a><a href="#guest">Гость</a><a href="#rsvp">Анкета · пример</a><button id="width" type="button">Мобильная ширина</button></nav>
<p id="toast" role="status" aria-live="polite"></p><main id="stage"></main>
<script>
'use strict';
const initial={title:'Наша свадьба',themeId:'sage',first:'Анна',second:'Михаил',localDate:'2027-06-12',localTime:'16:00',timeZone:'Europe/Moscow',venueName:'Усадьба «Тихий сад»',address:'Самара, Садовая улица, 12',routeUrl:'',program:false,programTime:'16:00',programText:'Сбор гостей',photo:false};
let data={...initial},mobile=false,state='saved',published=false,photoState='none',screen='templates',agreed=false,publishState='idle';
const stage=document.getElementById('stage');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){document.getElementById('toast').textContent=s;}
const steps=active=>'<div class="steps">'+['1 · Шаблон','2 · Редактор','3 · Предпросмотр','4 · Публикация'].map((x,i)=>'<span class="'+(i===active?'current':'')+'">'+x+'</span>').join('')+'</div>';
function field(label,key,type='text',required=false){return '<label>'+label+(required?' *':'')+'<input '+(required?'required ':'')+'type="'+type+'" data-key="'+key+'" value="'+esc(data[key])+'" '+(published&&!['first','second','venueName','address','programText'].includes(key)?'disabled':'')+'></label>';}
function invitation(form=false){const date=data.localDate?data.localDate.split('-').reverse().join(' · '):'Дата события';return '<article class="invite '+(data.themeId==='sand'?'sand':'')+'"><p class="eyebrow">Вместе начинается больше</p><h1>'+esc(data.first||'Первое имя')+'<em>и</em>'+esc(data.second||'Второе имя')+'</h1><p class="lede">Приглашаем разделить с нами<br>этот особенный день.</p><div class="date">'+esc(date)+'</div><p>'+esc(data.localTime||'Время')+' · '+esc(data.timeZone)+'</p>'+(data.photo&&photoState==='ready'?'<div class="wirephoto">МЕСТО ДЛЯ ФОТО</div>':'')+'<div class="venue"><p class="eyebrow">Место встречи</p><h2>'+esc(data.venueName||'Название места')+'</h2><p>'+esc(data.address||'Адрес события')+'</p>'+(data.routeUrl&&/^https:\/\//.test(data.routeUrl)?'<p><a href="'+esc(data.routeUrl)+'" target="_blank" rel="noopener noreferrer">Как добраться</a></p>':'')+'</div>'+(data.program?'<h2>Программа</h2><p>'+esc(data.programTime)+' · '+esc(data.programText)+'</p>':'')+(form?rsvpForm():'')+'<p class="fine">С теплом ждём вас</p></article>';}
function rsvpForm(){return '<form id="guestform" class="invitation-form"><span class="tag">Анкета первой версии · эскиз</span><h2>Вы будете с нами?</h2><p class="muted">Нам важно знать ваши планы.</p><label>Ваше имя или псевдоним *<input name="guestName" required maxlength="100" placeholder="Например, Александра"></label><label class="radio"><input type="radio" name="attendance" value="yes" checked>С радостью приду</label><label class="radio"><input type="radio" name="attendance" value="no">Не смогу прийти</label><label>Сопровождающие<select name="companions"><option>0</option><option>1</option><option>2</option></select></label><p class="fine">Предел сопровождающих и дополнительные вопросы ещё согласуются. Ответить можно без аккаунта.</p><button class="btn" type="submit">Отправить ответ · демонстрация</button><p id="guestresult" role="status"></p></form>';}
function notice(){const m={saved:['ok','Все изменения сохранены · имитация'],saving:['','Сохраняем изменения…'],offline:['error','Нет связи. Последние изменения не сохранены. Проверьте соединение и повторите.'],conflict:['error','Проект изменён в другой вкладке. Сверьте версии, прежде чем продолжить.'],loading:['','Загружаем проект…'],empty:['','Черновик пуст. Заполните обязательные поля.'],quota:['error','Два места публикации заняты. Проект на паузе тоже занимает место.'],processing:['','Фото обрабатывается. Публикация пока недоступна.'],uploadError:['error','Не удалось обработать фото. Повторите загрузку или уберите фото из черновика.']}[state]||['',''];return '<div class="notice '+m[0]+'" role="status">'+m[1]+(state==='saving'||state==='processing'?'<div class="progress"><span></span></div>':'')+'</div>';}
function stateControl(){return '<label>Состояние для ревью<select id="scenario">'+[['saved','Сохранено'],['empty','Пустой черновик'],['loading','Загрузка проекта'],['saving','Сохранение'],['offline','Ошибка сети'],['conflict','Конфликт версий'],['processing','Обработка фото'],['uploadError','Ошибка фото'],['quota','Квота исчерпана']].map(([v,l])=>'<option value="'+v+'" '+(state===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label>';}
function editor(){return steps(1)+'<div class="toolbar"><div><p class="kicker">Шаблон «Тихий сад» · v1</p><h1>Приглашение начинается здесь</h1></div><span class="tag">'+(published?'Опубликовано · правки текстов':'Приватный черновик')+'</span></div>'+stateControl()+notice()+(state==='loading'?'<div class="panel"><div class="placeholder">Поля появятся после загрузки</div></div>':'<div class="grid"><form id="editorform" class="panel"><p class="fine">* Обязательные поля. Шаблон изменить нельзя.</p>'+field('Название проекта · только для вас','title')+'<div class="formsection"><h2>Вы и ваше событие</h2><div class="row">'+field('Первое имя','first','text',true)+field('Второе имя','second','text',true)+'</div><div class="row">'+field('Дата события','localDate','date',true)+field('Время','localTime','time',true)+'</div>'+field('Часовой пояс','timeZone','text',true)+'</div><div class="formsection"><h2>Место</h2>'+field('Название места','venueName','text',true)+field('Адрес','address','text',true)+field('Ссылка на маршрут · необязательно','routeUrl','url')+'</div><div class="formsection"><h2>Дополните по желанию</h2><div class="upload"><label class="inline"><input type="checkbox" data-key="photo" '+(data.photo?'checked':'')+' '+(published?'disabled':'')+'>Фото пары · опциональный блок</label><p class="muted">JPEG, PNG или WebP. Лимиты файлов ещё согласуются.</p>'+(data.photo?'<div class="wirephoto">'+(photoState==='ready'?'ФОТО ГОТОВО':'ФОТО НЕ ГОТОВО')+'</div><div class="actions"><button class="btn secondary" type="button" id="photoReady" '+(published?'disabled':'')+'>Имитировать успешную обработку</button></div>':'')+'</div><label class="inline"><input type="checkbox" data-key="program" '+(data.program?'checked':'')+' '+(published?'disabled':'')+'>Программа дня · опциональный блок</label>'+(data.program?'<div class="row">'+field('Время пункта','programTime','time')+field('Описание пункта','programText')+'</div>':'')+'<label>Готовая палитра<select data-key="themeId" '+(published?'disabled':'')+'><option value="sage" '+(data.themeId==='sage'?'selected':'')+'>Шалфей</option><option value="sand" '+(data.themeId==='sand'?'selected':'')+'>Песок</option></select></label><p class="fine">Порядок блоков фиксирован. Анкета входит в первую публикацию и после неё не меняется.</p></div><div class="actions"><button type="button" id="retry" class="btn secondary" '+(published?'disabled':'')+'>Повторить сохранение</button><button class="btn" type="submit">Предпросмотр</button><button class="btn secondary" type="button" id="applyTexts">Применить тексты · демонстрация</button></div></form><aside class="sticky sidepreview"><p class="kicker">Направление оформления · эскиз</p>'+invitation()+'</aside></div>');}
function valid(){return ['first','second','localDate','localTime','timeZone','venueName','address'].every(k=>String(data[k]).trim())&&(!data.routeUrl||/^https:\/\//.test(data.routeUrl));}
function ready(){return valid()&&state==='saved'&&(!data.photo||photoState==='ready');}
function render(){publishState='idle';screen=location.hash.slice(1)||'templates';if(!['templates','editor','preview','confirm','published','guest','rsvp'].includes(screen))screen='templates';document.querySelectorAll('.review a').forEach(a=>a.setAttribute('aria-current',a.hash==='#'+screen?'page':'false'));stage.className=mobile?'narrow':'';let body='';
if(screen==='templates')body=steps(0)+'<p class="kicker">Один сценарий · четыре шаблона в полном MVP</p><h1>У каждого повода свой характер</h1><p class="muted">В этом эскизе подробно показан один свадебный шаблон.</p><div class="catalog"><article class="panel">'+invitation()+'<span class="tag">Свадьба · фиксированные блоки</span><h2>Тихий сад</h2><p>Тёплая бумага, спокойная типографика и тонкая ботаническая геометрия.</p><button id="choose" class="btn">Выбрать шаблон</button></article><article class="panel"><div class="placeholder">Второй свадебный шаблон<br>ещё не проектировался</div><h2>Другая история</h2><p class="muted">План полного MVP, вне первого сценария.</p></article><article class="panel"><div class="placeholder">Два праздничных шаблона<br>ещё не проектировались</div><h2>День рождения / юбилей</h2><p class="muted">Этот каталог не имитирует готовность четырёх шаблонов.</p></article></div>';
if(screen==='editor')body=editor();
if(screen==='preview')body=steps(2)+'<div class="toolbar"><div><h1>Посмотрите глазами гостей</h1><p class="muted">Приватный предпросмотр · ответы здесь не принимаются</p></div><span class="tag">'+(mobile?'Мобильная':'Настольная')+' ширина</span></div>'+(!ready()?'<div class="notice error">Есть несохранённые поля или неготовое фото. Вернитесь в редактор.</div>':'')+invitation()+'<div class="actions center"><a href="#editor" class="btn secondary">Вернуться к данным</a><a href="#confirm" class="btn">К публикации</a></div>';
if(screen==='confirm')body=steps(3)+'<div class="center panel"><p class="kicker">Последняя проверка</p><h1>Готовы поделиться?</h1><ul class="checklist"><li>Шаблон: «Тихий сад», имена, дата/время и место.</li><li>После публикации можно исправлять только тексты. Фото, даты, шаблон, блоки и анкета остаются неизменными.</li><li>Любой получатель общей ссылки сможет увидеть приглашение.</li><li>Пауза сохраняет остаток срока и продолжает занимать место.</li></ul><label class="radio"><input type="radio" checked name="plan">Бесплатный проект · 90 дней · 0 ₽</label><div class="notice">Бесплатно на 90 дней с первой публикации. Пример: с 10 ноября до 8 февраля 2027. Точную дату рассчитывает сервер. После полного истечения приглашение, фото и ответы будут удалены: сначала мягко, затем окончательно.</div>'+(!ready()?'<div class="notice error">Данные не готовы к публикации. Вернитесь в редактор.</div>':'')+'<label class="inline"><input type="checkbox" id="agree" '+(agreed?'checked':'')+'>Я проверил(а) данные и понимаю, что после публикации меняются только тексты</label><label>Состояние публикации для ревью<select id="publishscenario"><option value="idle">До запроса</option><option value="pending">Публикуется</option><option value="unknown">Потерян ответ</option><option value="failed">Подтверждённый отказ</option></select></label><p id="publishstatus" role="status"></p><div class="actions"><a href="#preview" class="btn secondary">Ещё раз посмотреть</a><button id="publish" class="btn" '+(published||!agreed||!ready()?'disabled':'')+'>Опубликовать · демонстрация</button></div><p class="fine">Никакие данные не отправляются. Анкета гостя входит в первую публикацию.</p></div>';
if(screen==='published')body='<div class="center panel"><span class="tag">'+(published?'Опубликовано в демонстрации':'Эскиз состояния успеха')+'</span><h1>Ваш повод готов к встрече</h1><p>Скопируйте ссылку и отправьте гостям самостоятельно.</p><p class="linkbox" id="publicurl">https://invite.example/i/7sKp2mV9wQ</p><div class="actions"><button class="btn" id="copy">Копировать пример ссылки</button><a href="#guest" class="btn secondary">Посмотреть приглашение</a></div><p id="copystatus" role="status"></p><div class="notice">Структура зафиксирована. Можно исправлять только тексты. Пауза остановит срок, но не освободит место.</div><a href="#editor">Посмотреть данные проекта</a></div>';
if(screen==='guest'||screen==='rsvp')body='<div class="toolbar center"><span class="tag">'+(screen==='rsvp'?'Анкета первой публикуемой версии':'Общая ссылка · без аккаунта')+'</span><button id="unavailable" class="btn secondary">Показать недоступность</button></div>'+invitation(true);
stage.innerHTML='<div class="shell"><header class="appbar"><span class="brand">ПОВОД</span><small>'+(screen==='guest'||screen==='rsvp'?'Свадебное приглашение':'Кабинет · Анна / RU')+'</small></header>'+body+'<footer>Проектирование, а не приложение. Синтетические данные. Без сетевых ресурсов, загрузки файлов и серверного сохранения.</footer></div>';bind();}
function go(s){location.hash=s;}
function bind(){const correct=document.getElementById('applyTexts');if(correct)correct.hidden=!published;const on=(id,event,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(event,fn);};on('choose','click',()=>{toast('Для эскиза считаем, что владелец уже вошёл по email и паролю.');go('editor');});on('scenario','change',e=>{state=e.target.value;if(state==='empty'){data={...initial,title:'',first:'',second:'',localDate:'',localTime:'',venueName:'',address:''};photoState='none';}else if(state==='saved'&&!valid()){data={...initial};}if(state==='processing'){data.photo=true;photoState='processing';}if(state==='uploadError'){data.photo=true;photoState='error';}render();});
document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>{const k=el.dataset.key;data[k]=el.type==='checkbox'?el.checked:el.value;state='saved';if(k==='photo'){photoState=data.photo?'processing':'none';if(data.photo)state='processing';}if(el.type==='checkbox'){render();return;}const preview=document.querySelector('.sidepreview');if(preview)preview.innerHTML='<p class="kicker">Направление оформления · эскиз</p>'+invitation();}));

on('unavailable','click',()=>{stage.innerHTML='<div class="shell center"><div class="panel"><p class="kicker">Приглашение</p><h1>Сейчас эта страница недоступна</h1><p>Свяжитесь с организатором, чтобы уточнить детали события.</p><p class="muted">Сведения о событии и форма скрыты.</p><button class="btn secondary" id="backguest">Вернуться к эскизу</button></div></div>';document.getElementById('backguest').onclick=render;});
on('guestform','change',e=>{if(e.target.name==='attendance'){const c=document.querySelector('[name=companions]');c.disabled=e.target.value==='no';if(c.disabled)c.value='0';}});on('guestform','submit',e=>{e.preventDefault();document.getElementById('guestresult').textContent='Эскиз подтверждения: спасибо, ваш ответ принят. Реальной отправки нет.';});}
document.getElementById('width').onclick=()=>{mobile=!mobile;document.getElementById('width').textContent=mobile?'Настольная ширина':'Мобильная ширина';render();};

if(location.search.includes('selftest')){const out=[];const check=(x,s)=>{if(!x)throw Error(s);out.push(s);};check(valid(),'seed-valid');state='processing';check(!ready(),'processing-blocks-publish');state='saved';data={...initial};published=true;location.hash='editor';render();check(document.querySelector('[data-key=localDate]').disabled&&!document.querySelector('[data-key=first]').disabled,'published-text-only');published=false;location.hash='rsvp';render();const decline=document.querySelector('[value=no]');decline.checked=true;decline.dispatchEvent(new Event('change',{bubbles:true}));check(document.querySelector('[name=companions]').disabled,'decline-disables-companions');location.hash='templates';render();const result=document.createElement('pre');result.id='selftest';result.textContent='PASS '+out.join(', ');document.body.append(result);}
