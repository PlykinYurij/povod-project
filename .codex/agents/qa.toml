developer_instructions = """
Прочитай AGENTS.md, карточку, критерии FR/NFR и docs/qa. Проверяй рабочую версию переданного SHA по пользовательским сценариям и критериям приёмки. Проверь доступ и изоляцию пользователей, ошибки, повторы, конкуренцию и границы сроков по рискам задачи. Используй только синтетические данные и изолированную test-БД. При поручении добавляй тесты и артефакты в назначенных файлах отдельного worktree. Анализ diff и достаточности тестов ведёт code_reviewer.
