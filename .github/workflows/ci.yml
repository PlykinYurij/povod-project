name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm on the disposable runner
        run: npm install --global npm@11.20.0

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck web and API
        run: npm run typecheck

      - name: Test artifact integrity rules
        run: npm test

      - name: Build web and API
        run: npm run build

      - name: Ensure tracked inputs are unchanged
        run: git diff --exit-code

  artifact:
    name: Build kit (linux-x64)
    needs: [verify, database]
    # A failed database job must fail the existing required check, not skip it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful verification and database tests
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$DATABASE_RESULT" = success
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm on the disposable runner
        run: npm install --global npm@11.20.0

      - name: Build once from committed source and smoke isolated runtimes
        id: kit
        run: npm run artifact:create

      - name: Upload immutable kit
        if: github.event_name == 'push'
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.kit.outputs.name }}
          path: ${{ steps.kit.outputs.path }}
          if-no-files-found: error
          overwrite: false

      - name: Record trusted download identity
        if: github.event_name == 'push'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf '\nArtifact ID: %s\n\nArtifact digest: `%s`\n\nDownload: %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  database:
    name: Database integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
        env:
          POSTGRES_USER: ci_bootstrap
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_bootstrap -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      POVOD_TEST_DATABASE_URL: postgresql://povod_test:synthetic-test-only@127.0.0.1:5432/povod_test
      POVOD_TEST_DATABASE: povod_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - name: Provision isolated synthetic test role
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -X -U ci_bootstrap -d postgres -v ON_ERROR_STOP=1 < infra/ci/test-database.sql
      - run: npm run build --workspace=@povod/api
      - name: Apply committed migrations twice
        run: |
          npm run db:migrate:test
          npm run db:migrate:test
      - name: Apply synthetic seed twice
        run: |
          npm run db:seed:test
          npm run db:seed:test
      - run: npm run test:database
      - run: git diff --exit-code
